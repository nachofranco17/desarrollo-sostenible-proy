name: Validacion del proyecto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y autorizacion RS20
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compilar y ejecutar todas las pruebas
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Guardar reportes de pruebas, incluso ante fallos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pruebas-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend y auditoria npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar las versiones del lockfile
        run: npm ci
      - name: Auditar dependencias
        run: npm audit --audit-level=high
      - name: Compilar el frontend
        run: npm run build
