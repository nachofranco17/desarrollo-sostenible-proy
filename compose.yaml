services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: xperience
      POSTGRES_USER: xperience
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el entorno}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xperience -d xperience"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
