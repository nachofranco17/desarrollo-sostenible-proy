# Perfil local: invitaciones en disco (InvitationDeliveryConfiguration @Profile("dev")).
# La base H2 y COOKIE_SECURE=false ya están en application.properties.

# RS19: en local el almacén de registros de seguridad se crea solo al iniciar, para no exigir pasos manuales.
# Estas credenciales son únicamente de desarrollo; fuera de dev el almacén se crea con
# scripts/crear-registro-seguridad y la aplicación recibe sólo la contraseña del escritor.
app.security-log.provision=true
app.security-log.admin-user=${SECURITY_LOG_ADMIN_USER:registro_auditor}
app.security-log.admin-password=${SECURITY_LOG_ADMIN_PASSWORD:auditor-solo-desarrollo}
app.security-log.writer-password=${SECURITY_LOG_WRITER_PASSWORD:escritor-solo-desarrollo}
