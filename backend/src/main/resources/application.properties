spring.application.name=xperience
app.invitations.base-url=${PUBLIC_APP_URL:http://localhost:5173}
app.invitations.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.port=${PORT:8081}
# Least privilege in the main database: Flyway migrates as the schema owner; the application serves
# requests with a user limited to data operations (PrivilegiosBaseDatos, docs/seguridad/minimo-privilegio-base-datos.md).
app.db.url=${DB_URL:jdbc:h2:file:./.data/xperience;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.flyway.url=${app.db.url}
spring.flyway.user=${DB_OWNER_USER:sa}
spring.flyway.password=${DB_OWNER_PASSWORD:}
# IFEXISTS: the application user never creates the database, because its creator becomes the admin.
spring.datasource.url=${app.db.url};IFEXISTS=TRUE
spring.datasource.username=${DB_USER:xperience_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
security.admin-session-timeout=10m
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
security.reauthentication-validity=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-http-post-size=16KB
server.shutdown=graceful
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.storage.dir=${STORAGE_DIR:./.data/archivos}
# The backend only exposes the API: no static resource handlers, so no file is served without the PEP (R14).
spring.web.resources.add-mappings=false
# RS19: separate append-only store for security events. The app only gets the INSERT-only writer;
# the store's admin credentials are used by scripts/crear-registro-seguridad and never configured here.
app.security-log.url=${SECURITY_LOG_URL:jdbc:h2:file:./.data/registros-seguridad;AUTO_SERVER=TRUE}
app.security-log.writer-user=${SECURITY_LOG_WRITER_USER:registro_escritor}
app.security-log.writer-password=${SECURITY_LOG_WRITER_PASSWORD:}
app.security-log.provision=false
