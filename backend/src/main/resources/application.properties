spring.application.name=xperience-backend

# Base de datos (solo desarrollo, ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/xperience
spring.datasource.username=xperience
spring.datasource.password=xperience

# El esquema lo crea Flyway; Hibernate solo verifica que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sin archivos estaticos: toda ruta tiene que pasar por el PEP (R5)
spring.web.resources.add-mappings=false
