spring.application.name=xperience
app.invitations.base-url=${PUBLIC_APP_URL:http://localhost:5173}
app.invitations.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./.data/xperience;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
security.admin-session-timeout=10m
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
security.reauthentication-validity=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-http-post-size=16KB
server.shutdown=graceful
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.storage.dir=${STORAGE_DIR:./.data/archivos}
