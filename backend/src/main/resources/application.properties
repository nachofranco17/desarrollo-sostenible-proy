spring.application.name=xperience
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xperience}
spring.datasource.username=${DB_USER:xperience}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-http-post-size=16KB
server.shutdown=graceful
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
