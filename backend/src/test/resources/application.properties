spring.datasource.url=jdbc:h2:mem:auth-tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
logging.level.root=WARN
app.invitations.base-url=http://localhost:5173
logging.level.org.springframework=WARN
logging.level.uy.edu.um.xperience.security.access=WARN
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

app.storage.dir=./target/test-archivos
spring.web.resources.add-mappings=false
app.security-log.url=jdbc:h2:mem:registros-seguridad
app.security-log.writer-user=registro_escritor
app.security-log.writer-password=escritor-de-prueba
app.security-log.provision=true
app.security-log.admin-user=registro_auditor
app.security-log.admin-password=auditor-de-prueba
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
